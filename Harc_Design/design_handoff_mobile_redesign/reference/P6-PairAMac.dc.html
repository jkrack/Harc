<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pair a Mac</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0066D6}a:hover{color:#004FA8}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #2B2B2E; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #000000; display: flex; flex-direction: column; padding-top: 58px">
  <div role="dialog" aria-label="Pair a Mac" style="flex: 1 1 auto; background: #FFFFFF; border-radius: 12px 12px 0 0; overflow: hidden; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: center; padding-top: 6px"><span style="width: 36px; height: 5px; border-radius: 999px; background: rgba(60,60,67,0.3); display: block"></span></div>
    <div style="display: grid; grid-template-columns: 80px minmax(0, 1fr) 80px; align-items: center; height: 44px; padding: 0 16px">
      <a href="NewSetup.dc.html" style="text-decoration: none; font-size: 17px">Cancel</a>
      <div style="text-align: center; font-size: 17px; font-weight: 600">Pair a Mac</div>
      <span></span>
    </div>
    <ol aria-label="Steps" style="list-style: none; margin: 12px 20px 0 20px; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <li style="display: flex; flex-direction: column; gap: 6px"><span style="height: 4px; border-radius: 999px; background: #0066D6; display: block"></span><span style="font-size: 12px; color: #3C3C43">1 Scan code</span></li>
      <li style="display: flex; flex-direction: column; gap: 6px"><span style="height: 4px; border-radius: 999px; background: #0066D6; display: block"></span><span style="font-size: 12px; font-weight: 600; color: #000000">2 Compare words</span></li>
      <li style="display: flex; flex-direction: column; gap: 6px"><span style="height: 4px; border-radius: 999px; background: #E5E5EA; display: block"></span><span style="font-size: 12px; color: #6C6C70">3 Approve on Mac</span></li>
    </ol>
    <div style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 0 28px; text-align: center">
      <span style="width: 64px; height: 64px; border-radius: 18px; background: #F2F2F7; display: flex; align-items: center; justify-content: center">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#3C3C43" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="11" rx="2.5"></rect><path d="M8 21h8"></path></svg>
      </span>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 22px; font-weight: 700">Do these words match?</h2>
        <p style="margin: 0; font-size: 15px; line-height: 21px; color: #3C3C43">Studio Mac is showing four words. They should be exactly the same as these.</p>
      </div>
      <div aria-label="Security words" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; width: 100%">
        <span style="padding: 14px 0; border-radius: 12px; background: #F2F2F7; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 20px; font-weight: 600">orbit</span>
        <span style="padding: 14px 0; border-radius: 12px; background: #F2F2F7; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 20px; font-weight: 600">maple</span>
        <span style="padding: 14px 0; border-radius: 12px; background: #F2F2F7; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 20px; font-weight: 600">lantern</span>
        <span style="padding: 14px 0; border-radius: 12px; background: #F2F2F7; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 20px; font-weight: 600">fjord</span>
      </div>
      <div style="font-size: 13px; color: #6C6C70">Code expires in 4 minutes</div>
    </div>
    <div style="padding: 0 20px 34px 20px; display: flex; flex-direction: column; gap: 10px">
      <button style="height: 50px; border: 0; border-radius: 12px; background: #0066D6; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer">They match</button>
      <button style="height: 44px; border: 0; border-radius: 12px; background: transparent; color: #D70015; font: inherit; font-size: 17px; cursor: pointer">They don't match</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
