name: Mobile navigation diagnostic

on:
  push:
    branches: [codex/mobile-host-navigation]

permissions:
  contents: read

jobs:
  navigation:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          xcode_candidates=(/Applications/Xcode_*.app)
          xcode_path=$(printf '%s\n' "${xcode_candidates[@]}" | sort -V | tail -1)
          sudo xcode-select -s "$xcode_path"
          xcodebuild -version
      - name: Preserve source and choose simulator
        run: |
          mkdir -p .build/navigation-diagnostic
          git rev-parse HEAD > .build/navigation-diagnostic/head.txt
          git status --porcelain > .build/navigation-diagnostic/source-status.txt
          shasum -a 256 HarcMobileApp/HarcMobileRootView.swift HarcMobileUITests/HarcMobileReleaseReadinessUITests.swift > .build/navigation-diagnostic/source.sha256
          python3 scripts/select-ios-configuration-simulator.py .build/navigation-diagnostic/destination.json
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Exercise exact route and shallow controls without retries
        shell: bash
        run: |
          set -o pipefail
          destination=$(python3 -c 'import json; print(json.load(open(".build/navigation-diagnostic/destination.json"))["destination"])')
          python3 scripts/run-package-tests.py --timeout-seconds 2400 --diagnostics-dir .build/navigation-diagnostic/diagnostics -- \
            xcodebuild -skipMacroValidation -skipPackagePluginValidation -jobs 2 \
            -project Harc.xcodeproj -scheme HarcMobile -configuration Debug \
            -destination "$destination" -derivedDataPath .build/navigation-derived \
            -resultBundlePath .build/navigation-diagnostic/navigation.xcresult \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -test-iterations 3 -test-repetition-relaunch-enabled YES \
            -only-testing:HarcMobileUITests/HarcMobileReleaseReadinessUITests/testSyncDetailsAreDiscoverableWithoutHostOrRecording \
            -only-testing:HarcMobileUITests/HarcMobileReleaseReadinessUITests/testHostTabFromLibraryRootControl \
            -only-testing:HarcMobileUITests/HarcMobileReleaseReadinessUITests/testHostTabFromSyncControl \
            -only-testing:HarcMobileUITests/HarcMobileReleaseReadinessUITests/testHostTabFromEmptyLocalRecordings \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO "HARC_BUILD_SHA=${{ github.sha }}" test \
            2>&1 | tee .build/navigation-diagnostic/console.log
      - name: Preserve every diagnostic outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-navigation-diagnostic
          path: .build/navigation-diagnostic
          retention-days: 3
