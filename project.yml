name: Harc
options:
  bundleIdPrefix: com.harc
  deploymentTarget:
    macOS: "26.0"
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.13.7"
    CURRENT_PROJECT_VERSION: "52"
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
    ONLY_ACTIVE_ARCH: NO
packages:
  HarcCore:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.4
targets:
  Harc:
    type: application
    platform: macOS
    sources:
      - path: HarcApp
      # Platform-neutral Client Library composition is shared with iOS. Keep
      # capture/scanner/UI files in the mobile target only.
      - path: HarcMobileApp/HarcMobileHostRoute.swift
      - path: HarcMobileApp/HarcMobileHostSessionConnector.swift
      - path: HarcMobileApp/HarcMobileLibraryAudio.swift
      - path: HarcMobileApp/HarcMobileLibraryCoordinator.swift
      - path: HarcMobileApp/HarcMobileMetadataMutation.swift
    dependencies:
      - package: HarcCore
        product: HarcCore
      - package: HarcCore
        product: HarcDomain
      - package: HarcCore
        product: HarcAudio
      - package: HarcCore
        product: HarcClient
      - package: HarcCore
        product: HarcClientStore
      - package: HarcCore
        product: HarcClientTransport
      - package: HarcCore
        product: HarcIdentity
      - package: HarcCore
        product: HarcProtocol
      - package: HarcCore
        product: HarcTransfer
      - package: HarcCore
        product: HarcAudioMobile
      - package: HarcCore
        product: HarcHost
      - package: HarcCore
        product: HarcHostTransport
      - package: HarcCore
        product: HarcStore
      - package: HarcCore
        product: HarcModels
      - package: HarcCore
        product: HarcVoiceprint
      - package: HarcCore
        product: HarcSummarize
      - package: HarcCore
        product: HarcUI
      - package: Sparkle
        product: Sparkle
    info:
      path: HarcApp/Info.plist
      properties:
        CFBundleName: Harc
        CFBundleDisplayName: Harc
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026 CloudArchitech LLC. All rights reserved."
        NSMicrophoneUsageDescription: "Harc uses the microphone to record meetings for transcription."
        NSCameraUsageDescription: "Harc uses a camera only when you scan a short-lived pairing code shown by your Harc host."
        NSScreenCaptureUsageDescription: "Harc captures system audio so remote participants appear in transcriptions."
        NSLocalNetworkUsageDescription: "Harc discovers and securely connects to paired Harc hosts on your local network."
        NSBonjourServices:
          - _harc._tcp
        CFBundleURLTypes:
          - CFBundleURLName: com.harc.Harc.deeplink
            CFBundleURLSchemes:
              - harc
        # Sparkle 2 auto-updates. The private half of this key lives only
        # in the login Keychain (service "https://sparkle-project.org").
        SUFeedURL: "https://raw.githubusercontent.com/jkrack/Harc/main/appcast.xml"
        SUPublicEDKey: "5iiEp4xyYgKt4plNFXcPhfZmXoFYVz55cfZ6G7PmhDg="
        # Our updateChecksEnabled pref is the user-facing switch; this
        # suppresses Sparkle's separate first-launch permission prompt.
        SUEnableAutomaticChecks: true
        # Never profile users. Harc sends nothing about the machine.
        SUEnableSystemProfiling: false
    entitlements:
      path: HarcApp/Harc.entitlements
      properties:
        # disable-library-validation removed 2026-07-17 (go-public hardening).
        # HarcApp/Harc.entitlements retains the full rationale.
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harc.Harc
        CODE_SIGN_ENTITLEMENTS: HarcApp/Harc.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ARCHS: arm64
    postCompileScripts:
      - name: Embed harc-stt daemon
        script: |
          "${SRCROOT}/scripts/build-daemon.sh"
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/harc-stt
      - name: Embed harc-mcp agent bridge
        script: |
          "${SRCROOT}/scripts/build-mcp.sh"
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/harc-mcp
  HarcAppUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: HarcAppUITests
    dependencies:
      - target: Harc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harc.HarcAppUITests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
        ARCHS: arm64

  HarcAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: HarcAppTests
    dependencies:
      - target: Harc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harc.HarcAppTests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
        ARCHS: arm64

  HarcMobile:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: HarcMobileApp
        excludes:
          - README.md
    dependencies:
      - package: HarcCore
        product: HarcAudioMobile
      - package: HarcCore
        product: HarcClientStore
      - package: HarcCore
        product: HarcClientTransport
      - package: HarcCore
        product: HarcDomain
      - package: HarcCore
        product: HarcIdentity
      - package: HarcCore
        product: HarcProtocol
      - package: HarcCore
        product: HarcTransfer
    info:
      path: HarcMobileApp/Info.plist
      properties:
        CFBundleName: Harc
        CFBundleDisplayName: Harc
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Harc records microphone audio only when you explicitly start a recording."
        NSCameraUsageDescription: "Harc uses the camera to scan a short-lived pairing code shown by your Harc host."
        NSLocalNetworkUsageDescription: "Harc discovers and securely connects to the Harc host you approve on your local network."
        NSBonjourServices:
          - _harc._tcp
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: HarcMobileApp/HarcMobile.entitlements
      properties:
        com.apple.developer.default-data-protection: NSFileProtectionComplete
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harc.HarcMobile
        PRODUCT_NAME: Harc
        PRODUCT_MODULE_NAME: HarcMobile
        CODE_SIGN_ENTITLEMENTS: HarcMobileApp/HarcMobile.entitlements
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_HARDENED_RUNTIME: NO

  HarcMobileAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: HarcMobileAppTests
    dependencies:
      - target: HarcMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harc.HarcMobileAppTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Harc.app/Harc"
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  HarcMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: HarcMobileUITests
    dependencies:
      - target: HarcMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harc.HarcMobileUITests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  HarcMobileSpikes:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: HarcMobileSpikes
        excludes:
          - README.md
    dependencies:
      - package: HarcCore
        product: HarcDomain
    info:
      path: HarcMobileSpikes/Info.plist
      properties:
        CFBundleName: HarcMobileSpikes
        CFBundleDisplayName: Harc Codec Spikes
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        HarcBuildSHA: "$(HARC_BUILD_SHA)"
        HarcSigningTeamIdentifier: "$(DEVELOPMENT_TEAM)"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harc.HarcMobileSpikes
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: NO
        HARC_BUILD_SHA: unrecorded

  HarcMobileSpikesTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: HarcMobileSpikesTests
    dependencies:
      - target: HarcMobileSpikes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harc.HarcMobileSpikesTests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: 1
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

schemes:
  HarcMobile:
    build:
      targets:
        HarcMobile: all
    run:
      config: Debug
    test:
      targets:
        - HarcMobileAppTests
        - HarcMobileUITests
  HarcMobileSpikes:
    build:
      targets:
        HarcMobileSpikes: all
    run:
      config: Debug
    test:
      targets:
        - HarcMobileSpikesTests
