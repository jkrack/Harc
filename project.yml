name: Harc
options:
  bundleIdPrefix: com.harc
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "33"
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
packages:
  HarcCore:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.4
targets:
  Harc:
    type: application
    platform: macOS
    sources:
      - path: HarcApp
    dependencies:
      - package: HarcCore
        product: HarcCore
      - package: HarcCore
        product: HarcAudio
      - package: HarcCore
        product: HarcClient
      - package: HarcCore
        product: HarcStore
      - package: HarcCore
        product: HarcModels
      - package: HarcCore
        product: HarcVoiceprint
      - package: HarcCore
        product: HarcSummarize
      - package: HarcCore
        product: HarcUI
      - package: Sparkle
        product: Sparkle
    info:
      path: HarcApp/Info.plist
      properties:
        CFBundleName: Harc
        CFBundleDisplayName: Harc
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026 CloudArchitech LLC. All rights reserved."
        NSMicrophoneUsageDescription: "Harc uses the microphone to record meetings for transcription."
        NSScreenCaptureUsageDescription: "Harc captures system audio so remote participants appear in transcriptions."
        CFBundleURLTypes:
          - CFBundleURLName: com.harc.Harc.deeplink
            CFBundleURLSchemes:
              - harc
        # Sparkle 2 auto-updates. The private half of this key lives only
        # in the login Keychain (service "https://sparkle-project.org").
        SUFeedURL: "https://raw.githubusercontent.com/jkrack/Harc/main/appcast.xml"
        SUPublicEDKey: "5iiEp4xyYgKt4plNFXcPhfZmXoFYVz55cfZ6G7PmhDg="
        # Our updateChecksEnabled pref is the user-facing switch; this
        # suppresses Sparkle's separate first-launch permission prompt.
        SUEnableAutomaticChecks: true
        # Never profile users. Harc sends nothing about the machine.
        SUEnableSystemProfiling: false
    entitlements:
      path: HarcApp/Harc.entitlements
      properties:
        # disable-library-validation removed 2026-07-17 (go-public hardening)
        # — see the rationale comment in HarcApp/Harc.entitlements.
        com.apple.security.device.audio-input: true

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harc.Harc
        CODE_SIGN_ENTITLEMENTS: HarcApp/Harc.entitlements
    postCompileScripts:
      - name: Embed harc-stt daemon
        script: |
          "${SRCROOT}/scripts/build-daemon.sh"
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/harc-stt
  HarcAppUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: HarcAppUITests
    dependencies:
      - target: Harc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harc.HarcAppUITests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
