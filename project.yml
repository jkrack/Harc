name: Harc
options:
  bundleIdPrefix: com.harc
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.5"
    CURRENT_PROJECT_VERSION: "7"
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
packages:
  HarcCore:
    path: .
targets:
  Harc:
    type: application
    platform: macOS
    sources:
      - path: HarcApp
    dependencies:
      - package: HarcCore
        product: HarcCore
      - package: HarcCore
        product: HarcAudio
      - package: HarcCore
        product: HarcClient
      - package: HarcCore
        product: HarcStore
      - package: HarcCore
        product: HarcModels
      - package: HarcCore
        product: HarcVoiceprint
      - package: HarcCore
        product: HarcSummarize
      - package: HarcCore
        product: HarcContext
      - package: HarcCore
        product: HarcUI
    info:
      path: HarcApp/Info.plist
      properties:
        CFBundleName: Harc
        CFBundleDisplayName: Harc
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        NSMicrophoneUsageDescription: "Harc uses the microphone to record meetings for transcription."
        NSScreenCaptureUsageDescription: "Harc captures system audio so remote participants appear in transcriptions."
    entitlements:
      path: HarcApp/Harc.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harc.Harc
        CODE_SIGN_ENTITLEMENTS: HarcApp/Harc.entitlements
    postCompileScripts:
      - name: Embed harc-stt daemon
        script: |
          "${SRCROOT}/scripts/build-daemon.sh"
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/harc-stt
  HarcAppUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: HarcAppUITests
    dependencies:
      - target: Harc
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harc.HarcAppUITests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO
